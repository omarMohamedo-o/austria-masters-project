name: Daily AI Scrape & Auto-update

# This workflow runs the AI-powered scraper daily.
# It uses Playwright to fetch pages and Gemini to extract new deadlines/fees.
# Any changes are committed directly to main, triggering a Vercel rebuild.

on:
  schedule:
    - cron: "0 6 * * *"   # Every day at 06:00 UTC
  workflow_dispatch: {}     # Manual trigger

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: |
          pip install uv
          uv pip install --system -r scraper/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run AI scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scraper/scrape.py

      - name: Check if data changed
        id: diff
        run: |
          if git diff --quiet -- data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git commit -m "chore(data): auto-update deadlines via AI scraper"
          git push

      - name: No changes
        if: steps.diff.outputs.changed == 'false'
        run: echo "No page changes detected this run. Skipping commit."
